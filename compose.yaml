name: shareo

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${SHAREO_DB_PASSWORD:-shareo_pass}
      MYSQL_DATABASE: shareo
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/migrations:ro
      - ./deploy/mysql-init/001_schema.sh:/docker-entrypoint-initdb.d/001_schema.sh:ro
    ports:
      - "${SHAREO_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "${SHAREO_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SHAREO_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SHAREO_MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${SHAREO_MINIO_PORT:-9000}:9000"
      - "${SHAREO_MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    ports:
      - "${SHAREO_QDRANT_HTTP_PORT:-6333}:6333"
      - "${SHAREO_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: .
    environment:
      SHAREO_DB_PASSWORD: ${SHAREO_DB_PASSWORD:-shareo_pass}
      SHAREO_JWT_SECRET: ${SHAREO_JWT_SECRET:-shareo-compose-development-secret}
      SHAREO_MINIO_ACCESS_KEY: ${SHAREO_MINIO_ACCESS_KEY:-minioadmin}
      SHAREO_MINIO_SECRET_KEY: ${SHAREO_MINIO_SECRET_KEY:-minioadmin}
      SHAREO_INTERNAL_TOKEN: ${SHAREO_INTERNAL_TOKEN:-shareo-dev-internal}
      SHAREO_AI_BASE_URL: http://ai-service:8000
    ports:
      - "${SHAREO_APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
    environment:
      SHAREO_AI_REDIS_URL: redis://redis:6379/0
      SHAREO_AI_QDRANT_URL: http://qdrant:6333
      SHAREO_AI_GO_BASE_URL: http://app:8080
      SHAREO_AI_INTERNAL_TOKEN: ${SHAREO_INTERNAL_TOKEN:-shareo-dev-internal}
      SHAREO_AI_MODEL_CACHE_DIR: /models
      SHAREO_AI_EMBEDDING_REVISION: ${SHAREO_AI_EMBEDDING_REVISION:-36e679e65c2a2fead755ae21162091293ad37834}
      SHAREO_AI_EMBEDDING_CONCURRENCY: ${SHAREO_AI_EMBEDDING_CONCURRENCY:-1}
    volumes:
      - hf_cache:/models
    ports:
      - "${SHAREO_AI_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data:
  qdrant_data:
  hf_cache:
