server:
  port: 8080
  mode: release
  trusted_origins: []

database:
  host: mysql
  port: 3306
  user: root
  password: shareo_pass
  dbname: shareo
  charset: utf8mb4
  max_idle_conns: 5
  max_open_conns: 20
  conn_max_lifetime: 300

redis:
  host: redis
  port: 6379
  password: ""
  db: 0
  pool_size: 10

minio:
  endpoint: minio:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: shareo
  use_ssl: false

jwt:
  secret: shareo-compose-development-secret
  expire_hours: 72
  login_cache_ttl_min: 30

upload:
  max_size: 52428800
  allowed_types:
    - image/jpeg
    - image/png
    - image/webp
    - image/gif
