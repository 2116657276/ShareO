server:
  host: 0.0.0.0
  port: 8080
  # OrbStack smoke runs on plain HTTP; debug keeps the auth cookie non-Secure.
  mode: debug
  trusted_origins: []

database:
  host: postgres
  port: 5432
  user: shareo_app
  password: ""  # Required through SHAREO_DB_PASSWORD
  dbname: shareo
  sslmode: disable
  timezone: Asia/Shanghai
  max_idle_conns: 5
  max_open_conns: 20
  conn_max_lifetime: 300

redis:
  host: redis
  port: 6379
  password: ""
  db: 0
  pool_size: 10

minio:
  endpoint: minio:9000
  access_key: ""  # Required through SHAREO_MINIO_ACCESS_KEY
  secret_key: ""  # Required through SHAREO_MINIO_SECRET_KEY
  bucket: shareo
  use_ssl: false

jwt:
  secret: ""  # Required through SHAREO_JWT_SECRET
  expire_hours: 72
  login_cache_ttl_min: 30

upload:
  max_size: 52428800
  allowed_types:
    - image/jpeg
    - image/png
    - image/webp
    - image/gif
