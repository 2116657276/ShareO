name: Go CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: go mod download
      - run: gofmt -l . | tee /dev/stderr | grep -q . && exit 1 || true
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: bash -n start.sh && find scripts deploy -type f -name '*.sh' -exec bash -n {} +
