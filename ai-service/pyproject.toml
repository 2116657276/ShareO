[project]
name = "shareo-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "qdrant-client>=1.13",
    "httpx>=0.28",
    "numpy>=1.26",
    "Pillow>=10.4",
    "torch>=2.2",
    "transformers>=4.48",
]

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.28"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires live Redis/Qdrant services"]
