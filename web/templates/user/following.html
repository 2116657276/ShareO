{{ template "header" . }}
<section class="following-page" x-data="followingPage({{ .user_id }})" x-init="init()">
    <header class="following-intro">
        <div>
            <div class="eyebrow">FOLLOWING</div>
            <h1 class="h2 fw-bold mt-1 mb-2">关注动态</h1>
            <p class="text-muted mb-0">看看你关注的人最近分享了什么。</p>
        </div>
    </header>

    <section class="following-people surface-card" x-show="people.length > 0" x-cloak aria-labelledby="following-people-title">
        <header class="following-people-header">
            <div>
                <h2 id="following-people-title">已关注</h2>
                <p><span x-text="peopleTotal"></span> 位创作者</p>
            </div>
            <span class="following-people-hint">即使暂时没有发帖，也会出现在这里</span>
        </header>
        <div class="following-list" aria-label="已关注用户">
            <template x-for="user in people" :key="user.id">
                <article class="following-card">
                    <a class="following-card-profile" :href="'/user/' + user.id" :aria-label="'查看 ' + user.username + ' 的主页'">
                        <img class="following-card-avatar" :src="user.avatar_url || '/static/img/default-avatar.svg'" alt="" loading="lazy" onerror="this.src='/static/img/default-avatar.svg'">
                    </a>
                    <div class="following-card-info">
                        <a class="following-card-name" :href="'/user/' + user.id" x-text="user.username"></a>
                        <small class="following-card-bio" x-text="user.bio || '这个人还没有写简介。'"></small>
                        <small class="following-card-followed" x-text="user.followed_at ? '关注于 ' + formatFollowedTime(user.followed_at) : '已关注'"></small>
                    </div>
                    <div class="following-card-actions">
                        <a class="btn btn-sm btn-outline-secondary" :href="'/user/' + user.id">主页</a>
                        <button type="button" class="btn btn-sm btn-outline-primary" @click="startConversation(user)">私聊</button>
                    </div>
                </article>
            </template>
        </div>
        <div class="text-center mt-3" x-show="peopleHasMore" x-cloak>
            <button type="button" class="btn btn-sm btn-outline-secondary" :disabled="loadingPeople" @click="loadPeople()">
                <span x-text="loadingPeople ? '加载中…' : '加载更多关注'" ></span>
            </button>
        </div>
    </section>

    <div class="loading-block following-people-loading" x-show="loadingPeople && people.length === 0" x-cloak role="status">
        <span class="spinner-border" aria-label="关注列表加载中"></span>
    </div>

    <div class="state-panel is-error mb-3" x-show="errorMessage" x-cloak role="alert"><i class="bi bi-cloud-slash" aria-hidden="true"></i><h2 class="h5">关注动态暂时不可用</h2><p x-text="errorMessage"></p><button type="button" class="btn btn-outline-secondary" @click="init(true)">重新加载</button></div>
    <div class="loading-block" x-show="loadingFeed && feed.length === 0" x-cloak role="status"><span class="spinner-border" aria-label="动态加载中"></span></div>

    <div class="feed-grid is-single-column following-feed" id="followingFeed" x-show="feed.length > 0" x-cloak>
        <template x-for="post in feed" :key="post.id">
            <div x-html="renderPost(post)"></div>
        </template>
    </div>
    <div class="empty-block surface-panel" x-show="!loadingFeed && !loadingPeople && !errorMessage && feed.length === 0 && people.length === 0" x-cloak><i class="bi bi-people" aria-hidden="true"></i><h2 class="h5">还没有关注任何人</h2><p class="mb-3">从社区作品进入作者主页，就可以关注喜欢的创作者。</p><a class="btn btn-primary" href="/home">去发现作品</a></div>
    <div class="empty-block surface-panel" x-show="!loadingFeed && !loadingPeople && !errorMessage && feed.length === 0 && people.length > 0" x-cloak><i class="bi bi-images" aria-hidden="true"></i><h2 class="h5">关注的人还没有新作品</h2><p class="mb-0">你关注的创作者还没有新的已审核帖子，过一会儿再来看看吧。</p></div>
    <div class="text-center mt-4" x-show="feedHasMore" x-cloak><button type="button" class="btn btn-outline-secondary" :disabled="loadingFeed" @click="loadFeed()"><span x-text="loadingFeed ? '加载中…' : '加载更多'"></span></button></div>
</section>

<script src="/static/js/post-card.js?v=20260801-2"></script>
<script>
function followingPage(currentUserID) {
    return {
        currentUserID, people: [], peoplePage: 1, peopleTotal: 0, feed: [], feedPage: 1, feedTotal: 0,
        loadingPeople: false, loadingFeed: false, errorMessage: '',
        get peopleHasMore() { return this.people.length < this.peopleTotal; },
        get feedHasMore() { return this.feed.length < this.feedTotal; },
        async readJSON(response) { try { return await response.json(); } catch (_) { return {}; } },
        async init(reset = false) {
            if (reset) { this.people = []; this.peoplePage = 1; this.peopleTotal = 0; this.feed = []; this.feedPage = 1; this.feedTotal = 0; }
            this.errorMessage = '';
            await Promise.all([this.loadPeople(), this.loadFeed()]);
        },
        async loadPeople() {
            if (this.loadingPeople) return;
            this.loadingPeople = true;
            try {
                const response = await fetch(`/api/v1/users/${this.currentUserID}/following?page=${this.peoplePage}&page_size=20`);
                const body = await this.readJSON(response);
                if (!response.ok || body.code !== 0) throw new Error(body.message || '关注列表加载失败');
                const list = Array.isArray(body.data?.list) ? body.data.list : [];
                this.people = this.peoplePage === 1 ? list : [...this.people, ...list];
                this.peopleTotal = Number(body.data?.total) || 0;
                this.peoplePage += 1;
            } catch (error) { this.errorMessage = error.message || '网络连接异常，请稍后重试'; }
            finally { this.loadingPeople = false; }
        },
        async loadFeed() {
            if (this.loadingFeed) return;
            this.loadingFeed = true;
            try {
                const response = await fetch(`/api/v1/feed/following?page=${this.feedPage}&page_size=12`);
                const body = await this.readJSON(response);
                if (!response.ok || body.code !== 0) throw new Error(body.message || '关注动态加载失败');
                const list = Array.isArray(body.data?.list) ? body.data.list : [];
                this.feed = this.feedPage === 1 ? list : [...this.feed, ...list];
                this.feedTotal = Number(body.data?.total) || 0;
                this.feedPage += 1;
                this.$nextTick(() => window.ShareOPostCards.init(document.getElementById('followingFeed')));
            } catch (error) { this.errorMessage = error.message || '网络连接异常，请稍后重试'; }
            finally { this.loadingFeed = false; }
        },
        renderPost(post) {
            return window.ShareOPostCards.renderPostCard(post, {loading: 'lazy'});
        },
        formatFollowedTime(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '最近';
            return date.toLocaleDateString('zh-CN', {year: 'numeric', month: 'numeric', day: 'numeric'});
        },
        async startConversation(user) {
            if (!user?.id) return;
            try {
                const response = await fetch('/api/v1/conversations', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: user.id})
                });
                const body = await this.readJSON(response);
                if (!response.ok || body.code !== 0) throw new Error(body.message || '私聊创建失败');
                window.location.href = `/chat?conv=${body.data.id}`;
            } catch (error) {
                this.errorMessage = error.message || '私聊服务暂时不可用';
            }
        }
    };
}
</script>
{{ template "footer" . }}
