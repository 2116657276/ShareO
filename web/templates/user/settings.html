{{ template "header" . }}
<div class="row"><div class="col-lg-6 mx-auto">
    <div class="page-header">
        <div><div class="eyebrow">ACCOUNT</div><h1>账号设置</h1><p>管理个人资料和登录安全。</p></div>
        <div class="page-actions"><a href="/user/{{ .user_id }}" class="btn btn-outline-secondary">查看主页</a></div>
    </div>
    {{ if .Success }}<div class="alert alert-success">{{ .Success }}</div>{{ end }}
    {{ if .Error }}<div class="alert alert-danger">{{ .Error }}</div>{{ end }}
    <div class="surface-card p-3 p-md-4 mb-3">
        <h6 class="mb-3">个人信息</h6>
        <form method="POST" action="/settings">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" value="{{ .username }}" disabled>
                <small class="text-muted">用户名不可修改</small>
            </div>
            <div class="mb-3">
                <label class="form-label">邮箱</label>
                <input type="email" name="email" class="form-control" value="{{ .Email }}" placeholder="请输入邮箱">
            </div>
            <div class="mb-3">
                <label class="form-label">个人简介</label>
                <textarea name="bio" class="form-control" rows="3" placeholder="介绍一下自己..." maxlength="200">{{ .Bio }}</textarea>
                <small class="text-muted">最多200字</small>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> 保存设置</button>
        </form>
    </div>
    <div class="surface-card p-3 p-md-4">
        <h6 class="mb-3">安全</h6>
        <form method="POST" action="/settings/password">
            <div class="mb-3">
                <label class="form-label">当前密码</label>
                <input type="password" name="old_password" class="form-control" required minlength="6" placeholder="请输入当前密码">
            </div>
            <div class="mb-3">
                <label class="form-label">新密码</label>
                <input type="password" name="new_password" class="form-control" required minlength="6" placeholder="至少6个字符">
            </div>
            <button type="submit" class="btn btn-warning"><i class="bi bi-shield-lock"></i> 修改密码</button>
            <small class="text-muted d-block mt-2">修改后需要重新登录</small>
        </form>
    </div>
</div></div>
{{ template "footer" . }}
