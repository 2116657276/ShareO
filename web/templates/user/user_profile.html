{{ template "header" . }}
<div class="row" x-data="profilePage({{ .ProfileUser.ID }}, {{ .IsFollowing }})" x-init="load()">
    <div class="col-lg-10 mx-auto">
        <div class="d-flex align-items-center gap-3 mb-4">
            <img src="{{ .ProfileUser.AvatarURL }}" class="rounded-circle" width="88" height="88" style="object-fit:cover" onerror="this.src='/static/img/default-avatar.svg'">
            <div class="flex-grow-1">
                <h3 class="mb-1">{{ .ProfileUser.Username }}</h3>
                <p class="text-muted mb-2">{{ .ProfileUser.Bio }}</p>
				<div class="d-flex gap-3 small"><span>{{ .PostCount }} 作品</span><span>{{ .Followers }} 粉丝</span><span>{{ .Following }} 关注</span></div>
            </div>
            {{ if ne .user_id .ProfileUser.ID }}
            <button class="btn btn-outline-primary" @click="toggleFollow" x-text="following ? '已关注' : '关注'"></button>
            <button class="btn btn-primary" @click="startDM">私信</button>
            {{ end }}
        </div>

        <div class="feed-tabs mb-3">
            <button class="feed-tab" :class="{active: tab === 'posts'}" @click="switchTab('posts')">作品</button>
            <button class="feed-tab" :class="{active: tab === 'likes'}" @click="switchTab('likes')">点赞作品</button>
        </div>
        <div class="feed-grid">
            <template x-for="post in posts" :key="post.id">
                <a :href="`/post/${post.id}`" class="text-decoration-none feed-item">
                    <div class="feed-card">
                        <div class="card-img-container"><img :src="post.cover_image" alt="cover"></div>
                        <div class="card-body"><div class="card-title" x-text="post.content || '无标题'"></div></div>
                    </div>
                </a>
            </template>
        </div>
        <p class="text-center text-muted py-5" x-show="!loading && posts.length === 0">暂无内容</p>
    </div>
</div>
<script>
function profilePage(userId, initialFollowing) {
    return {
        tab: 'posts', posts: [], following: Boolean(initialFollowing), loading: false,
        async load() {
            this.loading = true;
			const url = this.tab === 'posts' ? `/api/v1/feed?user_id=${userId}&page=1&page_size=30` : `/api/v1/users/${userId}/likes?page=1&page_size=30`;
            const r = await fetch(url);
            if (r.ok) this.posts = (await r.json()).data?.list || [];
            this.loading = false;
        },
        switchTab(tab) { this.tab = tab; this.load(); },
        async toggleFollow() {
            const r = await fetch(`/api/v1/users/${userId}/follow`, {method:'POST'});
            const d = await r.json(); if (r.ok && d.code === 0) this.following = Boolean(d.data.following);
        },
        async startDM() {
            const r = await fetch('/api/v1/conversations', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user_id:userId})});
            const d = await r.json(); if (r.ok && d.code === 0) location.href = `/chat?conv=${d.data.id}`;
        }
    };
}
</script>
{{ template "footer" . }}
