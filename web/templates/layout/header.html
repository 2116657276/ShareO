{{ define "header" }}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>{{ .title }}</title>
    <script>
        (() => {
            try {
                if (window.localStorage.getItem('shareo.theme') === 'mono') {
                    document.documentElement.dataset.theme = 'mono';
                }
            } catch (_) {}
        })();
    </script>
    <link href="/static/vendor/bootstrap/css/bootstrap.min.css?v=5.3.3" rel="stylesheet">
    <link href="/static/vendor/bootstrap-icons/font/bootstrap-icons.css?v=1.11.3" rel="stylesheet">
    <link href="/static/css/style.css?v=20260801-4" rel="stylesheet">
    <script defer src="/static/vendor/alpinejs/alpine.min.js?v=3.14.1"></script>
</head>
<body class="{{ if .user_id }}app-body app-authenticated{{ else }}public-body{{ end }}">
<a class="skip-link" href="#main-content">跳转到主要内容</a>
{{ if .user_id }}
<div class="app-shell">
    <aside class="app-sidebar" aria-label="主导航">
        <a class="app-brand" href="/home" aria-label="ShareO 首页">
            <span class="app-brand-mark"><i class="bi bi-camera"></i></span>
            <span class="app-brand-name">ShareO</span>
        </a>
        <nav class="app-nav" aria-label="页面导航">
            <a class="app-nav-link" data-nav="home" href="/home"><i class="bi bi-house-door"></i><span>主页</span></a>
            <a class="app-nav-link" data-nav="following" href="/following"><i class="bi bi-people"></i><span>关注</span></a>
            <a class="app-nav-link" data-nav="search" href="/search/images"><i class="bi bi-search"></i><span>搜索</span></a>
            <a class="app-nav-link" data-nav="chat" href="/chat"><i class="bi bi-chat-dots"></i><span>私聊</span><span class="nav-unread-count" data-chat-unread hidden></span></a>
            <a class="app-nav-link" data-nav="profile" href="/user/{{ .user_id }}"><i class="bi bi-person"></i><span>我的</span><span class="nav-comment-dot" data-comment-unread hidden aria-label="有未读评论"></span></a>
        </nav>
    </aside>
    <header class="mobile-topbar">
        <a class="app-brand" href="/home" aria-label="ShareO 首页"><span class="app-brand-mark"><i class="bi bi-camera"></i></span><span class="app-brand-name">ShareO</span></a>
    </header>
    <nav class="mobile-bottom-nav" aria-label="移动端主导航">
        <a class="mobile-nav-link" data-nav="home" href="/home"><i class="bi bi-house-door"></i><span>主页</span></a>
        <a class="mobile-nav-link" data-nav="following" href="/following"><i class="bi bi-people"></i><span>关注</span></a>
        <a class="mobile-nav-link" data-nav="search" href="/search/images"><i class="bi bi-search"></i><span>搜索</span></a>
        <a class="mobile-nav-link" data-nav="chat" href="/chat"><i class="bi bi-chat-dots"></i><span>私聊</span><span class="nav-unread-count" data-chat-unread hidden></span></a>
        <a class="mobile-nav-link" data-nav="profile" href="/user/{{ .user_id }}"><i class="bi bi-person"></i><span>我的</span><span class="nav-comment-dot" data-comment-unread hidden aria-label="有未读评论"></span></a>
    </nav>
    <main id="main-content" class="app-main main-content">
{{ else }}
    <main id="main-content" class="public-main main-content">
{{ end }}
{{ end }}
