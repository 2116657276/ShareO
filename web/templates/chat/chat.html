{{ template "header" . }}
<section class="chat-page-shell" x-data="chatApp()" x-init="init()">
    <div class="chat-panel">
        <div class="chat-conversation-index" x-show="view === 'list'" x-cloak>
            <header class="chat-index-header">
                <div><div class="eyebrow">MESSAGES</div><h1>私聊</h1><p>选择一位聊过的用户继续对话。</p></div>
            </header>
            <div class="state-panel is-error m-3" x-show="errorMessage" x-cloak role="alert">
                <i class="bi bi-cloud-slash" aria-hidden="true"></i><h2 class="h5">消息服务暂时不可用</h2>
                <p x-text="errorMessage"></p><button type="button" class="btn btn-outline-secondary" @click="loadConvs()">重新加载</button>
            </div>
            <div class="loading-block" x-show="loadingConvs" x-cloak role="status"><span class="spinner-border" aria-label="加载中"></span></div>
            <div class="empty-block py-5" x-show="!loadingConvs && !errorMessage && visibleConvs.length === 0" x-cloak>
                <i class="bi bi-chat-dots" aria-hidden="true"></i><h2 class="h5">暂无私聊消息</h2>
                <p class="mb-0">从用户主页发起私聊，发送第一条消息后会显示在这里。</p>
            </div>
            <div class="conversation-list-scroll" x-show="visibleConvs.length > 0" x-cloak>
                <template x-for="c in visibleConvs" :key="c.id">
                    <button type="button" class="conversation-row" @click="openConv(c)">
                        <span class="conversation-identity">
                            <img class="conversation-preview-avatar" :src="conversationAvatar(c)" alt="" onerror="this.src='/static/img/default-avatar.svg'">
                            <span class="conversation-name"><strong x-text="c.title || '私聊用户'"></strong><small><span class="online-dot" :class="{online:c.online}"></span><span x-text="c.online ? '在线' : '离线'"></span></small></span>
                        </span>
                        <span class="conversation-summary">
                            <span class="conversation-time" x-text="conversationTime(c)"></span>
                            <span class="conversation-preview" x-text="messagePreview(c.last_message)"></span>
                        </span>
                        <span x-show="c.unread_count > 0" class="conversation-unread" x-text="c.unread_count > 99 ? '99+' : c.unread_count"></span>
                    </button>
                </template>
            </div>
        </div>

        <div class="chat-conversation-detail" x-show="view === 'detail'" x-cloak>
            <header class="chat-detail-header">
                <button type="button" class="chat-back-button" @click="backToList()" aria-label="返回私聊列表"><i class="bi bi-arrow-left"></i></button>
                <div class="chat-peer-summary" x-show="!isBotConversation()" x-cloak>
                    <img class="chat-detail-avatar" :src="conversationAvatar(activeConversation)" alt="" onerror="this.src='/static/img/default-avatar.svg'">
                    <span><strong x-text="activeConvTitle || '私聊'"></strong><small x-text="activeConversation?.online ? '在线' : '私聊会话'"></small></span>
                </div>
                <strong class="chat-bot-heading" x-show="isBotConversation()" x-cloak>问问小O</strong>
                <span class="agent-mode-label ms-auto" x-show="isBotConversation() && agentMode"><i class="bi bi-stars"></i> 深度分析</span>
            </header>
            <div class="state-panel is-error m-3" x-show="errorMessage" x-cloak role="alert">
                <p class="mb-2" x-text="errorMessage"></p><button type="button" class="btn btn-sm btn-outline-secondary" @click="loadMsgs()">重新加载</button>
            </div>
            <div class="msg-area" x-ref="msgArea">
                <button x-show="hasMore" class="btn btn-sm btn-link w-100" @click="loadMore">加载更多</button>
                <template x-for="m in messages" :key="m.id">
                    <div class="message-row" :class="m.sender_id === userId ? 'is-mine' : 'is-other'">
                        <div class="msg-bubble" :class="m.sender_id === userId ? 'mine' : 'other'">
                            <div class="message-content" x-text="m.content"></div>
                            <div x-show="citationList(m).length" class="citation-group">
                                <small class="citation-heading">来源帖子</small>
                                <template x-for="citation in citationList(m)" :key="citation.chunk_id">
                                    <a class="citation-card" :href="'/post/' + citation.post_id">
                                        <i class="bi bi-file-earmark-image" aria-hidden="true"></i>
                                        <span><strong x-text="'帖子 #' + citation.post_id"></strong><small>查看已审核来源</small></span>
                                        <i class="bi bi-chevron-right ms-auto" aria-hidden="true"></i>
                                    </a>
                                </template>
                            </div>
                            <details x-show="agentTrace(m)" class="agent-trace-card">
                                <summary><i class="bi bi-diagram-3 me-1"></i>深度分析步骤</summary>
                                <div class="agent-trace-body">
                                    <template x-for="step in agentTrace(m)?.steps || []" :key="step.index">
                                        <div class="agent-step"><span x-text="step.tool + ' · ' + step.status"></span><span x-text="step.result_count + ' 条 · ' + step.duration_ms + ' ms'"></span></div>
                                    </template>
                                </div>
                            </details>
                        </div>
                    </div>
                </template>
            </div>
            <form class="chat-compose" @submit.prevent="sendMsg">
                <div x-show="isBotConversation()" class="form-check form-switch agent-mode-switch">
                    <input class="form-check-input" type="checkbox" id="agentMode" x-model="agentMode">
                    <label class="form-check-label" for="agentMode">深度分析</label>
                </div>
                <div class="input-group">
                    <label class="visually-hidden" for="message-input">消息内容</label>
                    <input id="message-input" class="form-control" x-model="newMsg" maxlength="2000" placeholder="输入消息…">
                    <button type="submit" class="btn btn-primary" :disabled="!newMsg.trim() || sending">
                        <span x-show="!sending">发送</span><span x-show="sending">发送中…</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
<script>
function chatApp() {
    return {
        userId: {{ .user_id }}, convs: [], activeConv: null, activeConversation: null, activeConvTitle: '',
        view: 'list', messages: [], newMsg: '', agentMode: false, sending: false, hasMore: false,
        loadingConvs: false, ws: null, reconnectDelay: 1000, errorMessage: '',
        requestedConv: Number(new URLSearchParams(location.search).get('conv')) || 0,
        requestedBotAgent: new URLSearchParams(location.search).get('bot') === 'agent',

        get visibleConvs() { return this.convs.filter(c => c.last_message && !this.isBotConversationData(c)); },
        async init() {
            await this.loadConvs();
            if (this.requestedBotAgent) await this.openBotAgent();
            this.connectWS();
        },
        async readJSON(response) { try { return await response.json(); } catch (_) { return {}; } },
        async loadConvs() {
            this.loadingConvs = true; this.errorMessage = '';
            try {
                const response = await fetch('/api/v1/conversations');
                const body = await this.readJSON(response);
                if (!response.ok || body.code !== 0) throw new Error(body.message || '会话加载失败');
                this.convs = this.sortConversations(body.data || []);
                if (this.requestedConv) {
                    const conversation = this.convs.find(c => c.id === this.requestedConv);
                    this.requestedConv = 0;
                    if (conversation && !this.isBotConversationData(conversation)) this.openConv(conversation);
                }
                if (this.activeConv) {
                    const current = this.convs.find(c => c.id === this.activeConv);
                    if (current) this.activeConversation = current;
                }
            } catch (error) {
                this.errorMessage = error.message || '会话服务暂时不可用';
            } finally {
                this.loadingConvs = false;
            }
        },
        openConv(conversation, useAgent = false) {
            if (!conversation?.id) return;
            this.activeConv = conversation.id;
            this.activeConversation = conversation;
            this.activeConvTitle = conversation.title || '私聊';
            this.agentMode = Boolean(useAgent);
            this.messages = [];
            this.errorMessage = '';
            this.view = 'detail';
            this.loadMsgs();
        },
        backToList() {
            this.view = 'list';
            this.activeConv = null;
            this.activeConversation = null;
            this.activeConvTitle = '';
            this.messages = [];
            this.errorMessage = '';
            this.loadConvs();
        },
        async openBotAgent() {
            this.requestedBotAgent = false;
            let conversation = this.convs.find(c => c.title === 'shareo_bot');
            if (!conversation) {
                try {
                    const searchResponse = await fetch('/api/v1/users/search?q=shareo_bot&limit=20');
                    const searchBody = await this.readJSON(searchResponse);
                    const bot = (searchBody.data || []).find(user => user.is_bot && user.username === 'shareo_bot');
                    if (!bot) throw new Error('暂未找到小O');
                    const createResponse = await fetch('/api/v1/conversations', {
                        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({user_id: bot.id})
                    });
                    const createBody = await this.readJSON(createResponse);
                    if (!createResponse.ok || createBody.code !== 0) throw new Error(createBody.message || '小O会话创建失败');
                    await this.loadConvs();
                    conversation = this.convs.find(c => c.id === createBody.data.id) || {id: createBody.data.id, title: 'shareo_bot', members: [{user_id: bot.id, user: bot}]};
                } catch (error) {
                    this.errorMessage = error.message || '小O暂时不可用';
                    return;
                }
            }
            this.openConv(conversation, true);
        },
        sortConversations(items) {
            return [...items].sort((a, b) => new Date(this.conversationSortTime(b)) - new Date(this.conversationSortTime(a)) || Number(b.id) - Number(a.id));
        },
        conversationSortTime(c) { return c.last_message?.created_at || c.followed_at || c.created_at || 0; },
        conversationTime(c) {
            const date = new Date(this.conversationSortTime(c));
            if (Number.isNaN(date.getTime())) return '';
            const today = new Date();
            return date.toDateString() === today.toDateString()
                ? date.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'})
                : date.toLocaleDateString('zh-CN', {month:'numeric', day:'numeric'});
        },
        messagePreview(message) { return String(message?.content || '').replace(/\s+/g, ' ').slice(0, 56) || '还没有消息'; },
        conversationAvatar(c) {
            const peer = (c?.members || []).find(member => Number(member.user_id) !== Number(this.userId));
            return peer?.user?.avatar_url || '/static/img/default-avatar.svg';
        },
        isBotConversationData(conversation) {
            if (conversation?.title === 'shareo_bot') return true;
            return (conversation?.members || []).some(member => member?.user?.is_bot && member.user.username === 'shareo_bot');
        },
        async loadMsgs(before = 0) {
            if (!this.activeConv) return;
            let url = `/api/v1/conversations/${this.activeConv}/messages?limit=30`;
            if (before) url += `&before_id=${before}`;
            try {
                const response = await fetch(url);
                const body = await this.readJSON(response);
                if (!response.ok || body.code !== 0) throw new Error(body.message || '消息加载失败');
                const batch = (body.data?.messages || []).reverse();
                this.messages = before ? [...batch, ...this.messages] : batch;
                this.hasMore = Boolean(body.data?.has_more);
                this.$nextTick(() => {
                    if (this.$refs.msgArea) this.$refs.msgArea.scrollTop = this.$refs.msgArea.scrollHeight;
                });
                if (this.messages.length) await this.markRead(this.messages[this.messages.length - 1].id);
            } catch (error) {
                this.errorMessage = error.message || '消息服务暂时不可用';
            }
        },
        loadMore() { if (this.messages.length) this.loadMsgs(this.messages[0].id); },
        async sendMsg() {
            const content = this.newMsg.trim();
            if (!content || this.sending || !this.activeConv) return;
            this.newMsg = ''; this.sending = true; this.errorMessage = '';
            const payload = {content};
            if (this.isBotConversation()) payload.ai_mode = this.agentMode ? 'agent' : 'rag';
            try {
                const response = await fetch(`/api/v1/conversations/${this.activeConv}/messages`, {
                    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
                });
                const body = await this.readJSON(response);
                if (!response.ok || body.code !== 0) throw new Error(body.message || '消息发送失败');
                this.appendMsg(body.data);
                await this.loadConvs();
            } catch (error) {
                this.errorMessage = error.message || '消息发送失败，请稍后重试';
            } finally {
                this.sending = false;
            }
        },
        appendMsg(message) {
            if (message && !this.messages.some(existing => existing.id === message.id)) this.messages.push(message);
            this.$nextTick(() => {
                if (this.$refs.msgArea) this.$refs.msgArea.scrollTop = this.$refs.msgArea.scrollHeight;
            });
        },
        async markRead(messageID) {
            await fetch(`/api/v1/conversations/${this.activeConv}/read`, {
                method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message_id:messageID})
            }).catch(() => {});
            window.dispatchEvent(new Event('shareo:unread-refresh'));
        },
        isBotConversation() { return this.isBotConversationData(this.activeConversation); },
        metaObject(message) {
            if (!message?.meta) return null;
            try { return typeof message.meta === 'string' ? JSON.parse(message.meta) : message.meta; } catch (_) { return null; }
        },
        citationList(message) {
            const citations = this.metaObject(message)?.citations;
            return Array.isArray(citations) ? citations.filter(c => Number(c.post_id) > 0 && typeof c.chunk_id === 'string') : [];
        },
        agentTrace(message) {
            const trace = this.metaObject(message)?.agent_trace;
            return trace && Array.isArray(trace.steps) ? trace : null;
        },
        connectWS() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            this.ws = new WebSocket(`${protocol}//${location.host}/ws`);
            this.ws.onopen = () => { this.reconnectDelay = 1000; };
            this.ws.onmessage = event => {
                try {
                    const payload = JSON.parse(event.data);
                    if (payload.type !== 'new_message' || !payload.data?.message) return;
                    const message = payload.data.message;
                    if (message.conversation_id === this.activeConv && this.view === 'detail') {
                        this.appendMsg(message);
                        this.markRead(message.id);
                    }
                    this.loadConvs();
                    window.dispatchEvent(new Event('shareo:unread-refresh'));
                } catch (_) {}
            };
            this.ws.onerror = () => { this.errorMessage = '实时连接已断开，正在重试…'; };
            this.ws.onclose = () => {
                window.setTimeout(() => this.connectWS(), this.reconnectDelay);
                this.reconnectDelay = Math.min(this.reconnectDelay * 2, 16000);
            };
        }
    };
}
</script>
{{ template "footer" . }}
